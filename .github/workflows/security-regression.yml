name: Security regression

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and public-file check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Isolated Python regressions
        run: python -m unittest discover -s tests -v
      - name: Public-file privacy gate
        run: python tools/privacy_scan.py
      - name: Verify distributable archive
        run: python tools/package_skill.py
      - name: Parse PowerShell helpers (no GUI actions)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in (Get-ChildItem -LiteralPath scripts -Filter '*.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              throw "PowerShell parse errors in $($file.Name)"
            }
          }
